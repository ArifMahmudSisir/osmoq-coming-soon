<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osmoq - Coming Soon</title>
    <meta name="description" content="Osmoq is coming soon. Get ready for something amazing.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <main class="glass-container">
        <header>
            <h1 class="logo">OSMOQ</h1>
        </header>
        
        <section class="content">
            <h2 class="title">Something <span class="highlight">extraordinary</span> is in the works.</h2>
            <p class="subtitle">We are crafting a new experience. Be the first to know when we launch.</p>
            
            <div class="countdown" id="countdown">
                <div class="time-block">
                    <span class="time-value" id="days">00</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-block">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-block">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-label">Minutes</span>
                </div>
                <div class="time-block">
                    <span class="time-value" id="seconds">00</span>
                    <span class="time-label">Seconds</span>
                </div>
            </div>
            
            <form class="notify-form" id="notify-form">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Enter your email address" required>
                    <button type="submit" class="btn">Notify Me <i class="fas fa-arrow-right"></i></button>
                </div>
                <p class="form-message" id="form-message"></p>
            </form>
        </section>
        
        <footer>
            <div class="social-links">
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <p class="copyright">&copy; 2026 Osmoq. All rights reserved.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
